services:
  upwork-cover-letter-api:
    build: .
    container_name: upwork-cover-letter-api
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_WRITER=${MODEL_WRITER:-gemini/gemini-2.5-flash-preview-05-20}
      - MODEL_CLASSIFIER=${MODEL_CLASSIFIER:-gemini/gemini-2.5-flash-preview-05-20}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./files:/app/files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s